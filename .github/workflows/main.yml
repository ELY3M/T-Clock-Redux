name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: 

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7


    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          make
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-binutils
          mingw-w64-x86_64-make

    - name: Build
      shell: msys2 {0}
      run: |
        cd src/~ide
        make clean
        make

    - name: Zipping up Release folders
      run: | 
        zip -r ${{ github.workspace }}\t-clock-release.zip ${{ github.workspace }}\Release


    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false    
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
        files: ${{ github.workspace }}\t-clock-release.zip
      env:
        GITHUB_TOKEN: ${{ github.token }} 

      # - name: Upload EXE artifact
        # uses: actions/upload-artifact@v4
        # with:
          # name: windows-exe-${{ github.sha }}
          # path: ${{ steps.find_exe.outputs.exe_path }}
          # if-no-files-found: error